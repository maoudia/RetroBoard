name: Nightly

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full e2e suite on every browser and viewport (the push gate runs the core specs on Chromium).
  e2e:
    name: Playwright (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Ready-made browsers: no apt packages to download (the Ubuntu mirrors failed for hours and blocked every run).
    # Keep the tag equal to @playwright/test in pnpm-lock.yaml and bump the digest with it (same image in e2e.yml,
    # quality.yml and nightly.yml): docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 45
    # WebKit renders in software on the Linux runners and its failures change from run to run (the same specs pass on a
    # Mac): it reports, it does not gate the nightly run. Every other browser and viewport gates it.
    continue-on-error: ${{ matrix.project == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: '1/3' }
          - { project: chromium, shard: '2/3' }
          - { project: chromium, shard: '3/3' }
          - { project: firefox, shard: '1/3' }
          - { project: firefox, shard: '2/3' }
          - { project: firefox, shard: '3/3' }
          - { project: phone, shard: '1/3' }
          - { project: phone, shard: '2/3' }
          - { project: phone, shard: '3/3' }
          - { project: tv, shard: '1/3' }
          - { project: tv, shard: '2/3' }
          - { project: tv, shard: '3/3' }
          - { project: w360, shard: '1/3' }
          - { project: w360, shard: '2/3' }
          - { project: w360, shard: '3/3' }
          - { project: w768, shard: '1/3' }
          - { project: w768, shard: '2/3' }
          - { project: w768, shard: '3/3' }
          - { project: w1440, shard: '1/3' }
          - { project: w1440, shard: '2/3' }
          - { project: w1440, shard: '3/3' }
          # WebKit renders in software on the Linux runners and is about three times slower: more shards.
          - { project: webkit, shard: '1/8' }
          - { project: webkit, shard: '2/8' }
          - { project: webkit, shard: '3/8' }
          - { project: webkit, shard: '4/8' }
          - { project: webkit, shard: '5/8' }
          - { project: webkit, shard: '6/8' }
          - { project: webkit, shard: '7/8' }
          - { project: webkit, shard: '8/8' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 14
