name: Nightly

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full e2e suite on every browser and viewport (the push gate runs the core specs on Chromium).
  e2e:
    name: Playwright (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Ready-made browsers: no apt packages to download (the Ubuntu mirrors failed for hours and blocked every run).
    # Keep the tag equal to @playwright/test in pnpm-lock.yaml and bump the digest with it (same image in e2e.yml,
    # quality.yml and nightly.yml): docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 45
    # WebKit renders in software on the Linux runners and its failures change from run to run (the same specs pass on a
    # Mac): it reports, it does not gate the nightly run. Every other browser and viewport gates it.
    continue-on-error: ${{ matrix.project == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Longest jobs first: the plan runs 20 jobs at a time, a matrix starts in the order listed, and the 29 jobs
          # sum to about 400 minutes. Slow ones last (WebKit used to be) made a second wave wait for them: 30 minutes.
          # Measured on the nightly of 2026-11-12: WebKit 12 to 19 min, Firefox 15 to 19, Chromium and viewports 9 to 15.
          - { project: webkit, shard: '1/8' }
          - { project: webkit, shard: '2/8' }
          - { project: webkit, shard: '3/8' }
          - { project: webkit, shard: '4/8' }
          - { project: webkit, shard: '5/8' }
          - { project: webkit, shard: '6/8' }
          - { project: webkit, shard: '7/8' }
          - { project: webkit, shard: '8/8' }
          - { project: firefox, shard: '1/3' }
          - { project: firefox, shard: '2/3' }
          - { project: firefox, shard: '3/3' }
          - { project: w768, shard: '1/3' }
          - { project: w768, shard: '2/3' }
          - { project: w768, shard: '3/3' }
          - { project: tv, shard: '1/3' }
          - { project: tv, shard: '2/3' }
          - { project: tv, shard: '3/3' }
          - { project: w1440, shard: '1/3' }
          - { project: w1440, shard: '2/3' }
          - { project: w1440, shard: '3/3' }
          - { project: chromium, shard: '1/3' }
          - { project: chromium, shard: '2/3' }
          - { project: chromium, shard: '3/3' }
          - { project: w360, shard: '1/3' }
          - { project: w360, shard: '2/3' }
          - { project: w360, shard: '3/3' }
          - { project: phone, shard: '1/3' }
          - { project: phone, shard: '2/3' }
          - { project: phone, shard: '3/3' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          CI: 'true'
          # The full suite runs against `wrangler dev`; the relay-checks job below covers the Node adapter.
          E2E_TARGET: workerd
          # The runner sets HOME=/github/home (owned by pwuser) in the container and Firefox refuses to start unless
          # $HOME is owned by the user running it. Playwright docs: set HOME=/root when running in the container.
          HOME: /root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # The smoke test and the relay contract (scripts/relay-contract.mjs) against each runtime of the relay: the Node adapter and
  # `wrangler dev` (the Worker and the Durable Object). Change portable-relay-core, task 4.2.
  relay-checks:
    name: Relay checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [node, workerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: scripts/ci/relay-checks.sh ${{ matrix.target }}

  # Lighthouse (mobile profile) on the landing, /new, /accessibility and /privacy, light and dark, against
  # quality/lighthouse-budgets.json: the landing needs 95 for performance and 100 for accessibility (the R2 launch gate, docs/roadmap.md).
  # The scores are a table in the job summary. Change a11y-gate-and-derived-contrast, task 1.4.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    # The same ready-made browser image as the e2e job: Chromium is already there (chromium.executablePath() in scripts/quality/lighthouse.mjs).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm --filter @retroboard/relay build:node
      - name: Serve the site and run Lighthouse
        shell: bash
        env:
          HOME: /root
          # Median of 5 runs per page: the first run on this job scored /privacy 65 where the same build scores 100 on a laptop.
          LIGHTHOUSE_RUNS: '5'
        run: |
          PORT=18790 HOST=127.0.0.1 PUBLIC_DIR=apps/web/.output/public RATE_LIMIT_PER_MIN=0 MAX_CONNECTIONS_PER_ADDRESS=0 MAX_CONNECTS_PER_MINUTE=0 \
            node apps/relay/dist/node.mjs > relay.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18790/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18790/healthz >/dev/null || { cat relay.log; exit 1; }
          pnpm lighthouse http://127.0.0.1:18790 | tee -a "$GITHUB_STEP_SUMMARY"
