name: Container

# The self-host image has to start: build it, run it and smoke test it when its inputs change.
on:
  pull_request:
    paths:
      - Dockerfile
      - deploy/**
      - apps/relay/**
      - apps/web/**
      - scripts/smoke.mjs
      - scripts/ci/container-smoke.sh
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build, run and smoke test the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: retroboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image and smoke test it
        run: scripts/ci/container-smoke.sh retroboard:ci
