name: E2E

# Pull requests. Commits on main run the same matrix in quality.yml, the reports are published by quality-reports.yml.
on:
  pull_request:
  # By hand, and by release.yml on the release branch: the pull request of the release is opened with the Actions token,
  # which starts no workflow, so the release run dispatches the required checks itself.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (${{ matrix.project }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # Ready-made browsers: no apt packages to download (the Ubuntu mirrors failed for hours and blocked every run).
    # Keep the tag equal to @playwright/test in pnpm-lock.yaml and bump the digest with it (same image in e2e.yml,
    # quality.yml and nightly.yml): docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR gate: Chromium only. Firefox, phone, tv and WebKit run nightly (nightly.yml).
        project: [chromium]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      # Core specs only (tests/e2e/core.json): the full suite runs nightly on every browser.
      - run: pnpm e2e:core --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Slowest tests
        if: always()
        run: node scripts/quality/slow-tests.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}${{ matrix.shard != '1/1' && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report
            test-results
          retention-days: 7
