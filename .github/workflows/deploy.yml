name: Deploy

# Production deploy from CI, only after Checks and Quality are green on the same main commit (ADR-0030).
# Dormant until the repository variable CLOUDFLARE_DEPLOY is "true" and the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID exist. Turn the Cloudflare Workers Builds Git integration off at the same time, or every
# push deploys twice (docs/runbooks/deploy.md).
# 1. Gate: Checks and Quality succeeded for the commit this run is about.
# 2. Deploy the build with wrangler.
# 3. Smoke test production. A failing smoke test rolls the Worker back to the previous version and fails the run.
on:
  # The run only reads repository state and builds the commit of a successful main run, never code of a pull request.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: vars.CLOUDFLARE_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Gate on a green commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          for name in Checks Quality; do
            result=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.name == \"$name\")] | sort_by(.created_at) | last | (.status + \"/\" + (.conclusion // \"none\"))")
            echo "$name: ${result:-missing}"
            [[ "$result" == "completed/success" ]] || { echo "::warning::$name is not green for $SHA, not deploying (the $name run shows why)"; echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [[ "$SHA" != "$head" ]]; then echo "::notice::$SHA is no longer the head of main ($head): the newer commit deploys, not this one"; echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.stale != 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.stale != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.stale != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.stale != 'true'
      - run: pnpm generate
        if: steps.gate.outputs.stale != 'true'
      - name: Deploy
        id: deploy
        if: steps.gate.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ steps.gate.outputs.sha }}
        run: pnpm exec wrangler deploy --message "$GIT_SHA"
      - name: Smoke test production
        id: smoke
        if: steps.gate.outputs.stale != 'true'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: node scripts/smoke.mjs "$PROD_URL"
      - name: Roll back after a failed smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          echo "::error::Smoke test failed after deploying $GIT_SHA: rolling back to the previous version"
          pnpm exec wrangler rollback --message "Rollback: smoke test failed for $GIT_SHA" --yes
          # A Durable Object migration (wrangler.jsonc) cannot be rolled back: the run stays red so someone looks.
