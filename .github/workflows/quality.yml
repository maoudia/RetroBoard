name: Quality

# Every commit on main: unit tests with coverage, the full e2e matrix and mutation testing with a
# regression ratchet. All reports are published on GitHub Pages (index, history, per-tool reports)
# and kept as run artifacts (traces, screenshots, videos, raw JSON).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue, do not cancel: every commit on main gets its own measurements.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_URL: https://maoudia.github.io/RetroBoard

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests with coverage
        run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile.json=reports/unit/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-unit
          path: |
            coverage
            reports/unit
          retention-days: 30

  e2e:
    name: Playwright (${{ matrix.project }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, phone, tv]
        shard: ['1/1']
        # WebKit renders in software on Linux runners: about 3x slower, so it runs in 2 shards.
        include:
          - { project: webkit, shard: '1/2' }
          - { project: webkit, shard: '2/2' }
    # Same policy as e2e.yml: only Chromium blocks until responsive-and-i18n-hardening lands.
    continue-on-error: ${{ matrix.project != 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps ${{ matrix.project == 'firefox' && 'firefox' || matrix.project == 'webkit' && 'webkit' || 'chromium' }}
      - run: pnpm generate
      - run: pnpm e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Slowest tests
        if: always()
        run: node scripts/quality/slow-tests.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}${{ matrix.shard != '1/1' && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report
            test-results
          retention-days: 30

  mutation:
    name: Mutation testing and regression ratchet
    runs-on: ubuntu-latest
    # A cold run (no incremental cache) takes about 10 minutes; warm runs re-test only touched mutants.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Incremental mode: only mutants touched by the commit (code or tests) are re-run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - run: pnpm mutation
      - name: Compare with the floor and the previous main run
        run: node scripts/quality/mutation-score.mjs
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-mutation
          path: reports/mutation
          retention-days: 30

  pages:
    name: Publish reports to GitHub Pages
    needs: [unit, e2e, mutation]
    # Publish even when a test job failed: the reports are how humans see why.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Normalise artifact layout
        run: |
          mkdir -p artifacts/coverage artifacts/unit artifacts/mutation
          if [ -d artifacts/quality-unit/coverage ]; then cp -r artifacts/quality-unit/coverage/. artifacts/coverage/; fi
          if [ -d artifacts/quality-unit/reports/unit ]; then cp -r artifacts/quality-unit/reports/unit/. artifacts/unit/; fi
          if [ -d artifacts/quality-mutation ]; then cp -r artifacts/quality-mutation/. artifacts/mutation/; fi
      - name: Build the quality site
        run: node scripts/quality/build-site.mjs artifacts site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
