name: Quality

# Every commit on main: unit tests with coverage, the full e2e matrix and mutation testing with a
# regression ratchet. The Allure report (unit and e2e, with history) is the GitHub Pages front page, coverage and
# mutation sit beside it; traces, screenshots, videos and raw JSON stay as run artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs: queuing made a push wait for the previous one (27 minutes end to end).
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_URL: https://maoudia.github.io/RetroBoard

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests with coverage
        env:
          ALLURE_RESULTS_DIR: allure-results/unit
        # Reporters (default, json to reports/unit/results.json, Allure) come from vitest.config.ts when ALLURE_RESULTS_DIR is set.
        run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-unit
          path: |
            coverage
            reports/unit
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-unit
          path: allure-results/unit
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Playwright (${{ matrix.project }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The push gate is Chromium only. Firefox, phone, tv and WebKit run nightly (nightly.yml):
        # four projects on every push made the loop 27 minutes for differences that rarely appear.
        project: [chromium]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps ${{ matrix.project == 'firefox' && 'firefox' || matrix.project == 'webkit' && 'webkit' || 'chromium' }}
      - run: pnpm generate
      # Core specs only (tests/e2e/core.json): the full suite runs nightly on every browser.
      - run: pnpm e2e:core --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          ALLURE_RESULTS_DIR: allure-results/e2e-${{ matrix.project }}-${{ strategy.job-index }}
      - name: Slowest tests
        if: always()
        run: node scripts/quality/slow-tests.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-e2e-${{ matrix.project }}-${{ strategy.job-index }}
          path: allure-results/e2e-${{ matrix.project }}-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}${{ matrix.shard != '1/1' && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report
            test-results
          retention-days: 30

  # Every e2e spec outside the push gate, on Chromium, so the Allure report holds the whole suite. It does not gate the
  # run (continue-on-error): the core job above is the gate, a failure here shows in the report and in the nightly run.
  e2e-rest:
    name: Playwright rest of the suite (chromium ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate
      - run: pnpm e2e:rest --project=chromium --shard=${{ matrix.shard }}
        env:
          ALLURE_RESULTS_DIR: allure-results/e2e-rest-${{ strategy.job-index }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-e2e-rest-${{ strategy.job-index }}
          path: allure-results/e2e-rest-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-rest-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # One full Stryker pass per package, in parallel (the two biggest packages in several shards balanced by file size):
  # the whole run did not fit in 45 minutes on one runner.
  mutation:
    name: Mutation testing (${{ matrix.pkg }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: application, shard: '1/3' }
          - { pkg: application, shard: '2/3' }
          - { pkg: application, shard: '3/3' }
          - { pkg: domain, shard: '1/2' }
          - { pkg: domain, shard: '2/2' }
          - { pkg: protocol, shard: '1/1' }
          - { pkg: crypto, shard: '1/1' }
          - { pkg: exporters, shard: '1/1' }
          - { pkg: sync, shard: '1/1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Always a full pass (--force): a restored incremental cache kept survivors that new tests already kill, and the floors are 100.
      # The files come from scripts/quality/mutation-files.mjs, which applies the exclusions of stryker.config.json.
      - name: Mutation testing of this shard
        env:
          PKG: ${{ matrix.pkg }}
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(node scripts/quality/mutation-files.mjs "$PKG" "$SHARD")
          pnpm mutation --force --mutate "$files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.pkg }}-${{ strategy.job-index }}
          path: |
            reports/mutation/mutation.json
            reports/mutation/index.html
          retention-days: 30

  mutation-ratchet:
    name: Mutation regression ratchet
    needs: [mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - name: Merge the shards
        # 9 = the shards of the mutation matrix above
        run: node scripts/quality/mutation-merge.mjs shards reports/mutation 9
      - name: Mutation results for the Allure report
        run: node scripts/quality/mutation-allure.mjs reports/mutation/mutation.json allure-results-mutation
      - name: Compare with the floor and the previous main run
        run: node scripts/quality/mutation-score.mjs
        env:
          PAGES_URL: https://maoudia.github.io/RetroBoard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('allure-results-mutation/*-result.json') != ''
        with:
          name: allure-results-mutation
          path: allure-results-mutation
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-mutation
          path: reports/mutation
          retention-days: 30

  pages:
    name: Publish reports to GitHub Pages
    needs: [unit, e2e, e2e-rest, mutation-ratchet]
    # Publish even when a test job failed: the reports are how humans see why.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # One Allure report for the unit tests and every Playwright shard, with the run history kept on Pages.
      - name: Aggregate the Allure report
        run: |
          mkdir -p allure-results reports
          for d in artifacts/allure-results-*; do [ -d "$d" ] && cp -r "$d" "allure-results/$(basename "$d")"; done
          # The history sits at the site root; the first run after the move reads it from the old /allure/ path.
          curl -fsSL "$PAGES_URL/history.jsonl" -o reports/allure-history.jsonl \
            || curl -fsSL "$PAGES_URL/allure/history.jsonl" -o reports/allure-history.jsonl \
            || rm -f reports/allure-history.jsonl
          if ls allure-results/*/*-result.json >/dev/null 2>&1; then
            pnpm exec allure generate allure-results/* --clean
            mkdir -p artifacts/allure
            cp -r reports/allure/. artifacts/allure/
            cp reports/allure-history.jsonl artifacts/allure/history.jsonl
          else
            echo "No Allure results to aggregate"
          fi
      - name: Normalise artifact layout
        run: |
          mkdir -p artifacts/coverage artifacts/mutation
          if [ -d artifacts/quality-unit/coverage ]; then cp -r artifacts/quality-unit/coverage/. artifacts/coverage/; fi
          if [ -d artifacts/quality-mutation ]; then cp -r artifacts/quality-mutation/. artifacts/mutation/; fi
      - name: Build the site (Allure front page, coverage, mutation)
        run: node scripts/quality/build-site.mjs artifacts site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
