name: Quality

# Every commit on main: unit tests with coverage and the core e2e specs (the push gate). The slow tail, the rest of the
# e2e suite, mutation testing with its regression ratchet and the Allure report on GitHub Pages, runs after this
# workflow in quality-reports.yml, so the Release and Deploy gates (which wait for this run) do not wait for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A run in progress is never cancelled: the Release and Deploy gates wait for a green Quality on the commit it ran for, and a
# cancelled run never turns green. Newer pushes queue behind it, and only the newest queued run is kept (GitHub replaces the
# older pending one), so a burst of merges costs one extra run, not one per commit.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests with coverage
        env:
          ALLURE_RESULTS_DIR: allure-results/unit
        # Reporters (default, json to reports/unit/results.json, Allure) come from vitest.config.ts when ALLURE_RESULTS_DIR is set.
        run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-unit
          path: |
            coverage
            reports/unit
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-unit
          path: allure-results/unit
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Playwright (${{ matrix.project }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # Ready-made browsers: no apt packages to download (the Ubuntu mirrors failed for hours and blocked every run).
    # Keep the tag equal to @playwright/test in pnpm-lock.yaml and bump the digest with it (same image in e2e.yml,
    # quality.yml and nightly.yml): docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The push gate is Chromium only. Firefox, phone, tv and WebKit run nightly (nightly.yml):
        # four projects on every push made the loop 27 minutes for differences that rarely appear.
        project: [chromium]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      # Core specs only (tests/e2e/core.json): the full suite runs nightly on every browser.
      - run: pnpm e2e:core --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          ALLURE_RESULTS_DIR: allure-results/e2e-${{ matrix.project }}-${{ strategy.job-index }}
          # The push gate runs on the Node adapter (change portable-relay-core); e2e-workerd below covers `wrangler dev`.
          E2E_TARGET: node
      - name: Slowest tests
        if: always()
        run: node scripts/quality/slow-tests.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-e2e-${{ matrix.project }}-${{ strategy.job-index }}
          path: allure-results/e2e-${{ matrix.project }}-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.project }}${{ matrix.shard != '1/1' && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report
            test-results
          retention-days: 30

  # The smoke test and the relay contract (scripts/relay-contract.mjs) against each runtime of the relay: the Node adapter and
  # `wrangler dev` (the Worker and the Durable Object). Change portable-relay-core, task 4.2.
  relay-checks:
    name: Relay checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [node, workerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: scripts/ci/relay-checks.sh ${{ matrix.target }}

  # The same core specs against `wrangler dev`, the runtime of the hosted service: the required Playwright checks above run on the
  # Node adapter (E2E_TARGET=node), this job keeps the Worker and the Durable Object covered.
  e2e-workerd:
    name: Playwright wrangler (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm e2e:core --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          E2E_TARGET: workerd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-workerd-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 30

  # A run dispatched by the Actions token (agent-automerge.yml starts it after a bot merge) starts no workflow_run
  # workflow when it ends: Release, Deploy and Quality reports would never follow, and a maintainer had to start the
  # release by hand (actor id 41898282 is github-actions[bot]). Start them here, on a green gate. A push or a run dispatched by a person is followed by
  # workflow_run as usual, so nothing starts twice.
  follow-up:
    name: Start the release, the deploy and the reports
    needs: [unit, e2e, relay-checks, e2e-workerd]
    if: github.event_name == 'workflow_dispatch' && github.actor_id == '41898282'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the follow-up workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for wf in release.yml deploy.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main
          done
          gh workflow run quality-reports.yml --repo "$GITHUB_REPOSITORY" --ref main -f quality_run="$RUN_ID" -f sha="$GITHUB_SHA"

