name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # By hand, and by release.yml on the release branch: the pull request of the release is opened with the Actions token,
  # which starts no workflow, so the release run dispatches the required checks itself.
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  verify:
    name: Specs, lint, types, architecture, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec openspec validate --all --strict
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Architecture rules (dependency-cruiser)
        run: pnpm arch
      - name: Unused code and dependencies (knip)
        run: pnpm knip
      - name: Unit tests with coverage ratchets
        run: pnpm test:coverage
      - name: Production licenses
        run: pnpm run licenses:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  mutation:
    name: Mutants of the changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation-test the files this pull request changes (any survivor fails)
        env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm mutation:changed --base "$BASE"

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Commits of the push
        if: github.event_name == 'push'
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: node scripts/commits/check.mjs --range "$RANGE"
      - name: Commits and title of the pull request
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/commits/check.mjs --range "$RANGE"
          node scripts/commits/check.mjs --title "$TITLE"

  build:
    name: Static build, bundle budget, Worker dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm size
      - run: pnpm exec wrangler deploy --dry-run --outdir dist-worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/web/.output/public
          retention-days: 7

  spec-gate:
    name: Spec gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every feature, fix or performance change names its OpenSpec change
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Read title, labels and body now, not from the event: a label or an edit made right after the pull request
          # opened is not in the payload of the run that the opening started.
          TITLE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          BODY=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          export TITLE BODY LABELS
          node scripts/ci/spec-gate.mjs

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint comes from the Go module proxy (the PyPI wheel downloads a binary from GitHub releases, which answered
      # 504 for hours), zizmor from PyPI. Both are retried.
      - name: Install actionlint and zizmor
        run: |
          for attempt in 1 2 3 4; do
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 && pipx install zizmor && exit 0
            echo "attempt $attempt failed, retrying"; sleep $((attempt * 15))
          done
          exit 1
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: zizmor --offline .github/workflows
