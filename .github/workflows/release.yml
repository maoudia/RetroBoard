name: Release

# Automatic SemVer release from Conventional Commits (openspec/changes/automated-semver-release, ADR-0025).
# 1. Runs when Checks or Quality finishes on main (or by hand).
# 2. Gate: the current main commit must have a green Checks and a green Quality run; otherwise it stops quietly.
# 3. release-please opens or updates the release PR (version bump + CHANGELOG.md); this workflow merges it.
# 4. release-please runs again: tag vX.Y.Z and the GitHub Release with the changelog section.
# 5. The container image is built and pushed to GHCR for that tag.
# Events created with GITHUB_TOKEN do not start other workflows (a pull request it opens only gets runs held for approval),
# so every step lives in this file.
on:
  # zizmor: the run only reads repository state and the API, never code from a pull request; the gate
  # checks the real main commit, whatever branch name triggered this event.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Checks, Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/maoudia/retroboard
  # The workflows that hold the required checks of main: dispatched on the release branch, then read back.
  DISPATCHED: checks.yml e2e.yml security.yml adr.yml

jobs:
  release:
    name: Version, changelog and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    outputs:
      created: ${{ steps.publish.outputs.release_created || steps.prepare.outputs.release_created }}
      tag: ${{ steps.publish.outputs.tag_name || steps.prepare.outputs.tag_name }}
      version: ${{ steps.publish.outputs.version || steps.prepare.outputs.version }}
      major: ${{ steps.publish.outputs.major || steps.prepare.outputs.major }}
      minor: ${{ steps.publish.outputs.minor || steps.prepare.outputs.minor }}
    steps:
      - name: Gate on a green main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          subject=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message | split("\n")[0]')
          # The release commit itself is not rebuilt (GITHUB_TOKEN pushes start no workflow): judge its parent.
          if [[ "$subject" == "chore(main): release "* ]]; then
            sha=$(gh api "repos/$REPO/commits/$sha" --jq '.parents[0].sha')
          fi
          echo "main commit under test: $sha"
          ok=true
          for name in Checks Quality; do
            result=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&branch=main&per_page=50" \
              --jq "[.workflow_runs[] | select(.name == \"$name\" and (.event == \"push\" or .event == \"workflow_dispatch\"))] | sort_by(.created_at) | last | (.status + \"/\" + (.conclusion // \"none\"))")
            echo "$name: ${result:-missing}"
            [[ "$result" == "completed/success" ]] || ok=false
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          if [[ "$ok" != true ]]; then echo "::notice::Main is not green yet for $sha, no release (the next finished run retries)."; fi

      - name: Open or update the release PR
        id: prepare
        if: steps.gate.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # main requires its checks on every pull request. The release PR is opened with the Actions token, so GitHub holds
      # its pull_request runs at "action_required" until a maintainer approves them by hand (every release PR up to 1.52.0
      # waited for that click, then for a second full run of the suite). Light path instead: dispatch the required checks
      # on the release branch (their jobs report on the PR head commit, about 5 minutes: the PR only holds the version
      # and the changelog), drop the runs that wait for approval, copy the results onto the pull request (a dispatched run's
      # check runs are not counted by the pull request, see the step below), then let the pull request merge itself.
      - name: Run the required checks on the release branch
        id: dispatch
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.prepare.outputs.pr || '{}').headBranchName }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
        run: |
          # The spec gate wants a change or the no-spec label: a release is neither a feature nor an OpenSpec change.
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label no-spec
          # Runs of this commit from an earlier attempt are older than this (30 s of margin for the clock of the runner).
          echo "since=$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          read -ra workflows <<< "$DISPATCHED"
          for wf in "${workflows[@]}"; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done

      # The runs the pull request itself started cannot start without a click, and a run that never starts leaves the
      # merge waiting on it. Delete them (best effort: the dispatched runs above are the checks of this pull request).
      - name: Drop the pull_request runs that wait for approval
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.prepare.outputs.pr || '{}').headBranchName }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          for _ in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required" or .status == "action_required") | .id')
            [ -n "$ids" ] && break
            sleep 10
          done
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              && echo "deleted run $id, which waited for approval" \
              || echo "::warning::could not delete run $id, which waits for approval"
          done

      # Enabled while the checks run, so that GitHub merges the pull request the moment the last one is reported.
      - name: Enable auto-merge of the release PR
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
        run: |
          # Auto-merge cannot be enabled on a pull request that is already mergeable (a re-run after its checks were
          # reported): merge it then.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto \
            || gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      # The pull request does not count the check runs of a dispatched run, whatever their result: on release PR 1.52.1
      # all 12 required contexts were green on the head commit, `gh pr checks --required` listed CodeQL only and the
      # merge stayed BLOCKED. A commit status belongs to the commit, so it is counted. Once the dispatched runs finish,
      # each required context that the pull request does not report as a check run is copied from the dispatched check
      # run of the same name onto the head commit as a status of that name: the real result (success only when the check
      # succeeded), a required context nobody reports stays missing, and the contexts come from the ruleset of main, so
      # no check is dropped or added here by hand.
      - name: Report the dispatched checks on the release PR
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.prepare.outputs.pr || '{}').headBranchName }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          read -ra workflows <<< "$DISPATCHED"
          paths=$(printf '.github/workflows/%s\n' "${workflows[@]}" | jq -R . | jq -sc .)
          # The newest dispatched run of each workflow from this attempt, once all of them have finished (30 min at most).
          runs='[]'
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=workflow_dispatch&per_page=100" \
              | jq -c --arg since "$SINCE" --argjson paths "$paths" \
                '[.workflow_runs[] | select(.created_at >= $since and (.path | IN($paths[])))] | group_by(.path) | map(max_by(.created_at))') || runs='[]'
            jq -e --argjson n "${#workflows[@]}" 'length == $n and all(.[]; .status == "completed")' <<< "$runs" > /dev/null && break
            sleep 30
          done
          jq -e --argjson n "${#workflows[@]}" 'length == $n and all(.[]; .status == "completed")' <<< "$runs" > /dev/null \
            || { echo "::error::The dispatched checks did not all finish within 30 minutes"; exit 1; }
          suites=$(jq -c '[.[].check_suite_id]' <<< "$runs")
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --paginate --jq '.check_runs[]' \
            | jq -sc --argjson suites "$suites" '[.[] | select(.check_suite.id | IN($suites[]))]')
          reported=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup \
            --jq '[.statusCheckRollup[] | select(.__typename == "CheckRun") | .name]')
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')
          [ -n "$required" ] || { echo "::error::main has no required status check to report"; exit 1; }
          problems=0
          while IFS= read -r context; do
            if jq -e --arg c "$context" 'index($c) != null' <<< "$reported" > /dev/null; then
              echo "$context: the pull request reports it"
              continue
            fi
            check=$(jq -c --arg c "$context" '[.[] | select(.name == $c)] | sort_by(.completed_at) | last // empty' <<< "$checks")
            if [ -z "$check" ]; then
              echo "::error::$context is required by main and no dispatched run reports it (add its workflow to DISPATCHED)"
              problems=$((problems + 1))
              continue
            fi
            conclusion=$(jq -r '.conclusion // "none"' <<< "$check")
            url=$(jq -r .html_url <<< "$check")
            state=failure
            [ "$conclusion" = success ] && state=success
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="$context" -f target_url="$url" \
              -f description="Result of the run dispatched on the release branch (the pull request's own runs are held)" < /dev/null > /dev/null
            echo "$context: $conclusion, reported on the pull request as $state"
            if [ "$state" != success ]; then
              echo "::error::$context did not succeed: $url"
              problems=$((problems + 1))
            fi
          done <<< "$required"
          [ "$problems" = 0 ]

      - name: Wait for the release PR to merge
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
        run: |
          for _ in $(seq 1 40); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            [ "$state" = MERGED ] && exit 0
            [ "$state" = CLOSED ] && { echo "::error::The release PR was closed"; exit 1; }
            sleep 30
          done
          echo "::error::The release PR did not merge within 20 minutes of its checks being reported"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus,mergeable,reviewDecision,statusCheckRollup \
            --jq '"merge state: \(.mergeStateStatus), mergeable: \(.mergeable), review decision: \(.reviewDecision)", (.statusCheckRollup[] | "\(.name // .context): \(.status // "") \(.conclusion // .state)")' || true
          exit 1

      - name: Tag and publish the GitHub Release
        id: publish
        if: steps.gate.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Container image on GHCR
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            type=raw,value=${{ needs.release.outputs.major }}
            type=raw,value=latest
      # Scan before anything is published: a fixable critical or high vulnerability stops the release image.
      - name: Build the image for the scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: retroboard:scan
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image has to start and pass the smoke test before it is published (a base image change once broke it unseen).
      - name: Run the image and smoke test it
        run: scripts/ci/container-smoke.sh retroboard:scan
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retroboard:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload the scan to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the image (cosign, keyless)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # The workerd image of the previous release stays one more release as the `workerd` tag, a fallback for operators
      # that need to roll back from the Node adapter (portable-relay-core, ADR-0036). Same gates as the main image.
      - name: Build the workerd fallback for the scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: workerd
          load: true
          push: false
          tags: retroboard:scan-workerd
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Run the workerd fallback and smoke test it
        run: scripts/ci/container-smoke.sh retroboard:scan-workerd
      - name: Scan the workerd fallback (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retroboard:scan-workerd
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build and push the workerd fallback (amd64, arm64)
        id: push-workerd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: workerd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:workerd
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}-workerd
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Sign the workerd digest
        env:
          DIGEST: ${{ steps.push-workerd.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" sbom.spdx.json --clobber
      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<NOTES

          ### Container image

              docker pull $IMAGE:$VERSION

          The image is signed (cosign, keyless) and carries a build provenance attestation and an SBOM (\`sbom.spdx.json\`, attached to this release). Verify it:

              gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY
              cosign verify $IMAGE:$VERSION --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com

          The image runs the Node adapter. The previous workerd image stays one more release as \`$IMAGE:workerd\` (also \`$IMAGE:$VERSION-workerd\`) for a rollback.

          Self-hosting: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/self-hosting.md
          NOTES
          gh release edit "$TAG" --notes-file notes.md
