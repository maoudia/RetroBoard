name: Release

# Automatic SemVer release from Conventional Commits (openspec/changes/automated-semver-release, ADR-0025).
# 1. Runs when Checks or Quality finishes on main (or by hand).
# 2. Gate: the current main commit must have a green Checks and a green Quality run; otherwise it stops quietly.
# 3. release-please opens or updates the release PR (version bump + CHANGELOG.md); this workflow merges it.
# 4. release-please runs again: tag vX.Y.Z and the GitHub Release with the changelog section.
# 5. The container image is built and pushed to GHCR for that tag.
# Events created with GITHUB_TOKEN do not start other workflows, so every step lives in this file.
on:
  # zizmor: the run only reads repository state and the API, never code from a pull request; the gate
  # checks the real main commit, whatever branch name triggered this event.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Checks, Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/maoudia/retroboard

jobs:
  release:
    name: Version, changelog and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.publish.outputs.release_created || steps.prepare.outputs.release_created }}
      tag: ${{ steps.publish.outputs.tag_name || steps.prepare.outputs.tag_name }}
      version: ${{ steps.publish.outputs.version || steps.prepare.outputs.version }}
      major: ${{ steps.publish.outputs.major || steps.prepare.outputs.major }}
      minor: ${{ steps.publish.outputs.minor || steps.prepare.outputs.minor }}
    steps:
      - name: Gate on a green main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          subject=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message | split("\n")[0]')
          # The release commit itself is not rebuilt (GITHUB_TOKEN pushes start no workflow): judge its parent.
          if [[ "$subject" == "chore(main): release "* ]]; then
            sha=$(gh api "repos/$REPO/commits/$sha" --jq '.parents[0].sha')
          fi
          echo "main commit under test: $sha"
          ok=true
          for name in Checks Quality; do
            result=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.name == \"$name\")] | sort_by(.created_at) | last | (.status + \"/\" + (.conclusion // \"none\"))")
            echo "$name: ${result:-missing}"
            [[ "$result" == "completed/success" ]] || ok=false
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          if [[ "$ok" != true ]]; then echo "::notice::Main is not green yet for $sha, no release (the next finished run retries)."; fi

      - name: Open or update the release PR
        id: prepare
        if: steps.gate.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # main requires its checks on every pull request. The release PR is opened with the Actions token, which starts no
      # workflow: dispatch the required ones on its branch (their jobs report on the PR head commit), then let the
      # pull request merge itself once they pass.
      - name: Run the required checks on the release branch
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.prepare.outputs.pr || '{}').headBranchName }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
        run: |
          # The spec gate wants a change or the no-spec label: a release is neither a feature nor an OpenSpec change.
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label no-spec
          for wf in checks.yml e2e.yml security.yml adr.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done

      - name: Merge the release PR when its checks pass
        if: steps.gate.outputs.ready == 'true' && steps.prepare.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.prepare.outputs.pr || '{}').number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto
          for _ in $(seq 1 100); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            [ "$state" = MERGED ] && exit 0
            [ "$state" = CLOSED ] && { echo "::error::The release PR was closed"; exit 1; }
            sleep 30
          done
          echo "::error::The release PR did not merge within 50 minutes: a required check failed or is still running"
          exit 1

      - name: Tag and publish the GitHub Release
        id: publish
        if: steps.gate.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Container image on GHCR
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            type=raw,value=${{ needs.release.outputs.major }}
            type=raw,value=latest
      # Scan before anything is published: a fixable critical or high vulnerability stops the release image.
      - name: Build the image for the scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: retroboard:scan
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retroboard:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload the scan to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the image (cosign, keyless)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" sbom.spdx.json --clobber
      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<NOTES

          ### Container image

              docker pull $IMAGE:$VERSION

          The image is signed (cosign, keyless) and carries a build provenance attestation and an SBOM (\`sbom.spdx.json\`, attached to this release). Verify it:

              gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY
              cosign verify $IMAGE:$VERSION --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com

          Self-hosting: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/self-hosting.md
          NOTES
          gh release edit "$TAG" --notes-file notes.md
