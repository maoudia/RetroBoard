name: Post-deploy smoke

# Cloudflare Workers Builds deploys every commit of main (docs/runbooks/deploy.md). Main only receives commits that passed
# the required checks, so the deploy is already gated. This run waits for that deploy to finish, smoke tests production,
# and opens an urgent issue when production is broken (rollback is the dashboard or `wrangler rollback`).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test after the deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      issues: write
    env:
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the Cloudflare build of this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_URL" ]; then echo "::notice::PROD_URL is not set, skipping"; echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0; fi
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")] | first | (.status + "/" + (.conclusion // "none"))' 2>/dev/null || true)
            echo "Cloudflare build: ${state:-not started}"
            case "$state" in
              completed/success) echo "result=deployed" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed/*) echo "::error::The Cloudflare build of $SHA did not succeed"; echo "result=build-failed" >> "$GITHUB_OUTPUT"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::notice::No Cloudflare build reported for $SHA within 30 minutes, nothing to smoke test"
          echo "result=none" >> "$GITHUB_OUTPUT"
      - name: Smoke test production
        id: smoke
        if: steps.build.outputs.result == 'deployed'
        run: |
          # The new version can take a few seconds to reach every edge: retry before calling it broken.
          for attempt in 1 2 3 4; do
            node scripts/smoke.mjs "$PROD_URL" && exit 0
            echo "attempt $attempt failed"; sleep 30
          done
          exit 1
      - name: Open an issue when production fails its smoke test
        if: failure() && steps.build.outputs.result == 'deployed' && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label bug --label priority:1-urgent \
            --title "Production failed its smoke test after $SHA" \
            --body "The smoke test of $PROD_URL failed after the deploy of $SHA: $RUN. Roll back from the Cloudflare dashboard (Workers > retroboard > Deployments) or with \`npx wrangler rollback\`, then fix forward."
