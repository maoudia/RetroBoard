name: CLA

# External pull requests need a signed Contributor License Agreement (docs/CLA.md, change licensing-and-monetization).
# Signatures live in signatures/cla.json on the cla-signatures branch of this repository: no third-party app, no secret.
# Pull requests from a branch of this repository (members, Dependabot, release-please, Claude commits) are never checked.
# The commit status "CLA" on the head commit is the result: make it a required status check in the ruleset of main to enforce it.
on:
  # zizmor: pull_request_target is needed for a write token on fork pull requests; the script of the default branch only
  # reads commit authors through the API, nothing of the pull request is checked out or run.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA check
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # The default branch (never the pull request) supplies the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/cla-check.mjs
      - name: Check the signatures
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: node scripts/ci/cla-check.mjs
