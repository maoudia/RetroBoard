<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420"><rect width="1180" height="420" fill="#f5f5f7"/><text x="24" y="40" font-size="22" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Special cards, and the coffee cup that goes</text><g transform="translate(64 70) rotate(0 55 154) scale(1.1)"><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="1.25" y="1.25" width="97.5" height="137.5" rx="12" fill="#ffffff" stroke="#636366" stroke-width="2.5"/><g><path d="M34 48 C34 22 66 22 66 48 C66 66 50 66 50 84" fill="none" stroke="#1d1d1f" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="106" r="7.5" fill="#0066cc"/></g></g></g><text x="30" y="250" font-size="15" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Need more information</text><text x="30" y="269" font-size="12" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">"?"</text><text x="30" y="288" font-size="12" font-weight="400" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">I cannot estimate this yet.</text><text x="30" y="307" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">Counted as cast, kept out of</text><text x="30" y="326" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">the numbers; names listed.</text><g transform="translate(290 70) rotate(0 55 154) scale(1.1)"><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="1.25" y="1.25" width="97.5" height="137.5" rx="12" fill="#ffffff" stroke="#636366" stroke-width="2.5"/><g><rect x="18" y="40" width="46" height="62" rx="5" fill="none" stroke="#636366" stroke-width="2.4" stroke-dasharray="5 5"/><rect x="40" y="48" width="44" height="60" rx="5" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.6" transform="rotate(8 62 78)"/><path d="M52 116 L68 116 M62 108 L70 116 L62 124" fill="none" stroke="#0066cc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="256" y="250" font-size="15" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Pass</text><text x="256" y="269" font-size="12" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">~pass</text><text x="256" y="288" font-size="12" font-weight="400" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">It is not mine to size.</text><text x="256" y="307" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">A ballot (auto-reveal does not</text><text x="256" y="326" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">wait), not a card cast.</text><g transform="translate(516 70) rotate(0 55 154) scale(1.1)"><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="1.25" y="1.25" width="97.5" height="137.5" rx="12" fill="#ffffff" stroke="#636366" stroke-width="2.5"/><g><path d="M20 36 H48 L42 56 L54 74 L44 92 L50 108 H20 Z" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.6" stroke-linejoin="round" transform="translate(-4 0)"/><path d="M80 36 V108 H50 L44 92 L54 74 L42 56 L48 36 Z" fill="#0066cc" fill-opacity=".22" stroke="#1d1d1f" stroke-width="2.6" stroke-linejoin="round" transform="translate(4 0)"/></g></g></g><text x="482" y="250" font-size="15" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Split it</text><text x="482" y="269" font-size="12" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">~split</text><text x="482" y="288" font-size="12" font-weight="400" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Too big: break it up.</text><text x="482" y="307" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">Counted as cast; at half or</text><text x="482" y="326" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">more the verdict says split.</text><g transform="translate(742 70) rotate(0 55 154) scale(1.1)"><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="1.25" y="1.25" width="97.5" height="137.5" rx="12" fill="#ffffff" stroke="#636366" stroke-width="2.5"/><g><circle cx="50" cy="70" r="30" fill="none" stroke="#1d1d1f" stroke-width="2.6"/><circle cx="50" cy="70" r="23" fill="none" stroke="#636366" stroke-width="1.6" stroke-dasharray="2 3"/><path d="M36 71 L46 82 L66 58" fill="none" stroke="#0066cc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="708" y="250" font-size="15" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Already known</text><text x="708" y="269" font-size="12" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">~known</text><text x="708" y="288" font-size="12" font-weight="400" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">We know this one.</text><text x="708" y="307" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">Counted as cast; at half or</text><text x="708" y="326" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">more the story can close.</text><g transform="translate(968 70) rotate(0 55 154) scale(1.1)"><g font-family="ui-sans-serif, system-ui, sans-serif"><rect x="1.25" y="1.25" width="97.5" height="137.5" rx="12" fill="#ffffff" stroke="#636366" stroke-width="2.5"/><g><path d="M32 58 H68 V86 C68 98 32 98 32 86 Z" fill="none" stroke="#636366" stroke-width="2.4"/><path d="M68 64 C80 64 80 82 68 82" fill="none" stroke="#636366" stroke-width="2.4"/><path d="M42 50 C40 44 46 42 44 36 M54 50 C52 44 58 42 56 36" stroke="#636366" stroke-width="2" fill="none" stroke-linecap="round"/></g></g></g><text x="934" y="250" font-size="15" font-weight="700" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Break (retired)</text><text x="934" y="269" font-size="12" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">cup</text><text x="934" y="288" font-size="12" font-weight="400" fill="#1d1d1f" font-family="ui-sans-serif, system-ui, sans-serif">Only in rooms made before.</text><text x="934" y="307" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">Drawn by this family, never</text><text x="934" y="326" font-size="11" font-weight="400" fill="#636366" font-family="ui-sans-serif, system-ui, sans-serif">offered again.</text></svg>